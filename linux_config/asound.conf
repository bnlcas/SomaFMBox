#copy to /etc/asound.conf
pcm.dmixed {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:3,0"
        rate 44100
        period_time 0
        period_size 1024
        buffer_size 8192
    }
    bindings {
        0 0
        1 1
    }
}

pcm.!default {
    type plug
    slave.pcm "dmixed"
}

ctl.!default {
    type hw
    card 3
}
